<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para mi male</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Audios -->
  <audio id="bg-audio" loop src="assets/Always.mp3"></audio>
  <audio id="mixtape-audio"></audio>

  <!-- Pantalla 1: Apertura (Se mantiene igual) -->
  <section id="envelope-screen" class="screen">
    <div class="envelope" id="envelope-btn">
      <div class="envelope-stamp">🌸</div>
      <p class="tap-text">Tap to open</p>
    </div>
  </section>

  <!-- Pantalla 2: Dashboard Principal -->
  <section id="main-screen" class="screen hidden">
    <div class="dashboard-layout">
      
      <!-- COLUMNA IZQUIERDA -->
      <div class="left-col">
        
        <!-- 1. Reproductor ALWAYS con controles y letras -->
        <div class="organic-box player-box">
          <h3 class="box-title">Now Playing: Always</h3>
          
          <!-- Controles de Audio -->
          <div class="audio-controls">
            <div class="progress-container">
              <span id="current-time">0:00</span>
              <input type="range" id="seek-bar" value="0" min="0" max="100">
              <span id="duration">0:00</span>
            </div>
            <div class="volume-container">
              <span>🔊</span>
              <input type="range" id="volume-bar" min="0" max="1" step="0.01" value="0.5">
            </div>
          </div>

          <!-- Letras -->
          <div class="lyrics-scroll" id="lyrics-container"></div>
        </div>

        <!-- 2. Playlist YouTube -->
        <div class="organic-box yt-box">
          <h3 class="box-title">YouTube Playlist</h3>
          <div class="iframe-container">
            <iframe id="yt-player" src="https://www.youtube-nocookie.com/embed/videoseries?list=PL4o29bINVT4EG_y-k5jGoOu3-Am8Nvi10" frameborder="0" allowfullscreen></iframe>
          </div>
        </div>

      </div>

      <!-- COLUMNA DERECHA -->
      <div class="right-col">
        
        <!-- 3. Playlist MP3 -->
        <div class="organic-box mp3-box">
          <h3 class="box-title">Nuestra Playlist</h3>
          <div class="tracklist">
            <!-- NOTA: Si cambiaste los nombres sin tildes, actualiza el data-src aquí -->
            <div class="track-row" data-src="assets/Aqui-Donde-Te-Extrano.mp3">
              <span class="track-index">01</span>
              <div class="track-meta"><strong>Aquí Donde Te Extraño</strong></div>
              <button class="track-btn">▶</button>
            </div>
            <div class="track-row" data-src="assets/Como-me-duele-perderte.mp3">
              <span class="track-index">02</span>
              <div class="track-meta"><strong>Como me duele perderte</strong></div>
              <button class="track-btn">▶</button>
            </div>
            <div class="track-row" data-src="assets/Extranos.mp3">
              <span class="track-index">03</span>
              <div class="track-meta"><strong>Extraños</strong></div>
              <button class="track-btn">▶</button>
            </div>
            <div class="track-row" data-src="assets/Glimpse-of-Us.mp3">
              <span class="track-index">04</span>
              <div class="track-meta"><strong>Glimpse of Us</strong></div>
              <button class="track-btn">▶</button>
            </div>
            <div class="track-row" data-src="assets/Love-Me-Not.mp3">
              <span class="track-index">05</span>
              <div class="track-meta"><strong>Love Me Not</strong></div>
              <button class="track-btn">▶</button>
            </div>
            <!-- Agrega el resto de tus canciones siguiendo este formato... -->
          </div>
        </div>

      </div>

      <!-- FILA INFERIOR -->
      <div class="bottom-row">
        <!-- Botón de la carta -->
        <button class="organic-btn letter-trigger" id="open-letter-btn">
          Carta para mi male 💌
        </button>

        <!-- Minijuego de Memoria -->
        <div class="organic-box minigame-box">
          <h3 class="box-title">Minijuego: Encuentra los pares 🌸</h3>
          <div class="memory-board" id="memory-board">
            <!-- Las cartas se generan por JS -->
          </div>
          <p id="game-message" class="game-msg hidden">¡Ganaste! Eres increíble 💖</p>
        </div>
      </div>

    </div>
  </section>

  <!-- MODAL: La Carta Secreta -->
  <div id="letter-modal" class="modal-backdrop hidden">
    <div class="organic-box letter-paper">
      <button class="close-btn" id="close-letter-btn">&times;</button>
      <h2>Para ti,</h2>
      <p class="handwritten">
        Aquí irá todo lo que quieras decirle...
      </p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
